services:
  - type: web
    name: neurofly-malecns
    runtime: python
    region: singapore
    plan: 2c-16g
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: python -m pip install --upgrade pip && pip install -e '.[stonkfly]'
    startCommand: python -m neurofly cloud-server --host 0.0.0.0 --port $PORT --checkpoint /var/data/neurofly/maze-fly-001/brain.npz
    healthCheckPath: /api/status
    envVars:
      - key: STONKFLY_DATA
        value: /var/data/stonkfly
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: neurofly-data
      mountPath: /var/data
      sizeGB: 20
