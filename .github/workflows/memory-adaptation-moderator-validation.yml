name: NeuroFly Adaptation Moderator Validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/v1-memory-adaptation-moderator-validation
    paths:
      - "data/memory_adaptation_moderator_validation_v01.json"
      - "src/neurofly/memory_adaptation_moderator_validation.py"
      - "tests/test_memory_adaptation_moderator_validation.py"
      - "docs/experiments/V1_MEMORY_ADAPTATION_MODERATOR_VALIDATION.md"
      - ".github/workflows/memory-adaptation-moderator-validation.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: neurofly-memory-adaptation-moderator-validation
  cancel-in-progress: true

jobs:
  memory-adaptation-moderator-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      STONKFLY_DATA: /home/runner/.cache/neurofly/stonkfly
      SOURCE_STATE: runs/free-malecns
      STUDY_DIR: runs/memory-adaptation-moderator-validation
      BASE_CHECKPOINT: runs/memory-adaptation-moderator-validation/base-brain.npz
      RECEIPT: runs/memory-adaptation-moderator-validation/memory-adaptation-moderator-validation-receipt.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore prepared MaleCNS cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}

      - name: Restore latest production checkpoint read-only source
        uses: actions/cache/restore@v4
        with:
          path: runs/free-malecns
          key: neurofly-v06-state-memory-adaptation-moderator-validation-${{ github.run_id }}
          restore-keys: |
            neurofly-v06-state-

      - name: Install pinned Stonkfly integration
        run: python -m pip install -e '.[test,stonkfly]'

      - name: Validate preregistered moderator-validation contract
        run: pytest -q tests/test_memory_adaptation_moderator_validation.py

      - name: Prepare and verify MaleCNS
        run: |
          mkdir -p "$STONKFLY_DATA" "$STUDY_DIR"
          python -m stonkfly prepare
          python -m neurofly brain-status
          python -m neurofly host-preflight | tee "$STUDY_DIR/preflight.json"

      - name: Copy production brain into isolated baseline
        run: |
          test -f "$SOURCE_STATE/brain.npz"
          cp "$SOURCE_STATE/brain.npz" "$BASE_CHECKPOINT"
          test "$(realpath "$SOURCE_STATE/brain.npz")" != "$(realpath "$BASE_CHECKPOINT")"
          sha256sum "$SOURCE_STATE/brain.npz" "$BASE_CHECKPOINT"

      - name: Select adaptation strata before effect outcomes then validate
        run: |
          python -m neurofly.memory_adaptation_moderator_validation \
            --base-checkpoint "$BASE_CHECKPOINT" \
            --output-dir "$STUDY_DIR" \
            --receipt "$RECEIPT"

      - name: Validate evidence without opening moderator confirmation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("runs/memory-adaptation-moderator-validation/memory-adaptation-moderator-validation-receipt.json")
          r=json.loads(p.read_text())
          assert r["schema"]=="neurofly-memory-adaptation-moderator-validation-receipt-v0.1"
          assert r["status"]=="EXPLORATORY_ADAPTATION_MODERATOR_VALIDATION_COMPLETE"
          assert r["execution_valid"] is True
          assert all(r["config_gates"].values())
          assert all(r["evidence_gates"].values())
          selected=r["stratified_selection_manifest"]["selected"]
          assert len(selected)==8
          assert sum(x["stratum"]=="engaged" for x in selected)==4
          assert sum(x["stratum"]=="quiescent" for x in selected)==4
          assert r["moderator_confirmed"] is False
          for key in (
              "learning_validated","temporal_cue_index_confirmed","prefix_sequence_specificity_confirmed",
              "transient_state_carrier_confirmed","memory_expression_causal",
              "replacement_confirmatory_authorized","behavioral_promotion_authorized",
          ):
              assert r[key] is False
          assert r["production_checkpoint_mutated"] is False
          print("ADAPTATION_MODERATOR_VALIDATION_VALID",r["receipt_sha256"],r["validation"])
          PY

      - name: Publish evidence only
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-adaptation-moderator-validation-${{ github.run_id }}
          path: |
            runs/memory-adaptation-moderator-validation/preflight.json
            runs/memory-adaptation-moderator-validation/stratified-selection.json
            runs/memory-adaptation-moderator-validation/memory-adaptation-moderator-validation-receipt.json
          if-no-files-found: error
          retention-days: 14
