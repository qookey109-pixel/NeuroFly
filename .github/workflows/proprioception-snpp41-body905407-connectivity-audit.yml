name: NeuroFly SNpp41 Body 905407 Connectivity Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/proprioception-snpp41-body905407-connectivity-audit.yml"
      - "src/neurofly/proprioception_connectivity_audit.py"
      - "tests/test_proprioception_connectivity_audit.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neurofly-snpp41-body905407-connectivity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  malecns-snpp41-body905407-connectivity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STONKFLY_DATA: /home/runner/.cache/neurofly/stonkfly
      AUDIT_OUTPUT: runs/somatosensation/snpp41-body905407-connectivity-audit.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore prepared MaleCNS cache read-only
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            malecns-v1-

      - name: Install pinned Stonkfly integration
        run: python -m pip install -e '.[test,stonkfly]'

      - name: Prepare or verify pinned MaleCNS
        run: |
          mkdir -p "$STONKFLY_DATA" "$(dirname "$AUDIT_OUTPUT")"
          python -m stonkfly prepare
          python -m neurofly brain-status

      - name: Discover or verify body 905407 connectivity receipt
        run: |
          # Discovery-first: until a prepared receipt SHA256 is frozen in source,
          # this step intentionally exits non-zero after writing the evidence.
          python -m neurofly.proprioception_connectivity_audit \
            --output "$AUDIT_OUTPUT"

      - name: Publish body 905407 connectivity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-snpp41-body905407-connectivity-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/somatosensation/snpp41-body905407-connectivity-audit.json
          if-no-files-found: warn
          retention-days: 3
