name: NeuroFly SNpp41 Peer Morphology Protocol

on:
  pull_request:
    paths:
      - "src/neurofly/proprioception_peer_morphology_protocol.py"
      - "src/neurofly/proprioception_peer_swc_asset_audit.py"
      - "src/neurofly/proprioception_swc_asset_audit.py"
      - "tests/test_proprioception_peer_morphology_protocol.py"
      - ".github/workflows/snpp41-peer-morphology-protocol.yml"
      - "docs/experiments/V011_SNPP41_PEER_MORPHOLOGY_PROTOCOL.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-morphology-protocol:
    runs-on: ubuntu-24.04
    env:
      AUDIT_OUTPUT: runs/somatosensation/snpp41-peer-morphology-protocol.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install NeuroFly test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run unit gate
        run: pytest -q tests/test_proprioception_peer_morphology_protocol.py
      - name: Discover or verify peer-only morphology protocol
        run: |
          mkdir -p "$(dirname "$AUDIT_OUTPUT")"
          python -m neurofly.proprioception_peer_morphology_protocol --output "$AUDIT_OUTPUT"
      - name: Publish peer-only protocol receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-snpp41-peer-morphology-protocol-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AUDIT_OUTPUT }}
          if-no-files-found: warn
          retention-days: 3
