name: NeuroFly SNpp41 Body 905407 Morphology Envelope

on:
  pull_request:
    paths:
      - "src/neurofly/proprioception_target_morphology_envelope_audit.py"
      - "src/neurofly/proprioception_peer_morphology_protocol.py"
      - "src/neurofly/proprioception_peer_swc_asset_audit.py"
      - "src/neurofly/proprioception_swc_asset_audit.py"
      - "tests/test_proprioception_target_morphology_envelope_audit.py"
      - ".github/workflows/snpp41-body905407-morphology-envelope.yml"
      - "docs/experiments/V011_SNPP41_BODY905407_MORPHOLOGY_ENVELOPE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  morphology-envelope-audit:
    runs-on: ubuntu-24.04
    env:
      AUDIT_OUTPUT: runs/somatosensation/snpp41-body905407-morphology-envelope.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install NeuroFly test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run unit gate
        run: pytest -q tests/test_proprioception_target_morphology_envelope_audit.py
      - name: Apply frozen peer morphology envelope to body 905407
        run: |
          mkdir -p "$(dirname "$AUDIT_OUTPUT")"
          python -m neurofly.proprioception_target_morphology_envelope_audit --output "$AUDIT_OUTPUT"
      - name: Publish target morphology receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-snpp41-body905407-morphology-envelope-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AUDIT_OUTPUT }}
          if-no-files-found: warn
          retention-days: 3
