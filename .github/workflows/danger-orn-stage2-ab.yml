name: NeuroFly Stage 2 Danger ORN Maze A-B

on:
  # Evaluate real maze behavior *before* merging any experimental changes.
  # Unlike push-to-main runs, pull_request runs can be inspected by the
  # connected GitHub review tooling, including their evidence artifacts.
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/danger-orn-stage2-ab.yml"
      - "scripts/danger_orn_stage2_ab.py"
      - "src/neurofly/odor_stage2_evidence.py"
      - "src/neurofly/brain_runtime.py"
      - "src/neurofly/olfaction.py"
      - "src/neurofly/goal_training.py"
      - "src/neurofly/curriculum.py"
      - "src/neurofly/training.py"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/danger-orn-stage2-ab.yml"
      - "scripts/danger_orn_stage2_ab.py"
      - "src/neurofly/odor_stage2_evidence.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Prevent a PR trial from cancelling an unrelated production-reference run.
  group: neurofly-stage2-danger-gain-maze-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  same-checkpoint-maze-ab:
    # Never expose a production neural checkpoint cache to untrusted fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      STONKFLY_DATA: /home/runner/.cache/neurofly/stonkfly
      SOURCE_DIR: runs/free-malecns
      WORK_ROOT: runs/stage2-danger-gain-ab
      OUTPUT: runs/stage2-danger-gain-ab/report.json

    steps:
      - name: Checkout the exact candidate code under review
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore verified MaleCNS connectome
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}

      - name: Restore production checkpoint as read-only source
        uses: actions/cache/restore@v4
        with:
          path: runs/free-malecns
          key: neurofly-v06-state-danger-stage2-ab-${{ github.run_id }}
          restore-keys: |
            neurofly-v06-state-

      - name: Install pinned NeuroFly and Stonkfly
        run: python -m pip install -e '.[test,stonkfly]'

      - name: Verify prepared brain and exact starting state
        run: |
          mkdir -p "$STONKFLY_DATA" "$WORK_ROOT"
          python -m stonkfly prepare
          python -m neurofly brain-status
          test -f "$SOURCE_DIR/brain.npz"
          test -f "$SOURCE_DIR/brain.maze.json"
          test -f "$SOURCE_DIR/brain.decoder.json"

      - name: Run independent gain 1.6 / 2.4 / 3.2 Stage 2 maze arms
        run: |
          python scripts/danger_orn_stage2_ab.py \
            --source-dir "$SOURCE_DIR" \
            --work-root "$WORK_ROOT" \
            --steps 600 \
            --output "$OUTPUT"

      - name: Validate comparisons without promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("runs/stage2-danger-gain-ab/report.json").read_text())
          assert report["schema"] == "neurofly-danger-orn-stage2-ab-v1"
          assert report["status"] == "PASS"
          assert report["source_checkpoint_unchanged"] is True
          assert report["gains"] == [1.6, 2.4, 3.2]
          assert report["starting_curriculum_stage"] == 2
          assert report["steps_per_arm"] == 600
          assert report["source_checkpoint_unchanged"] is True
          assert set(report["arms"]) == {"1.6", "2.4", "3.2"}
          assert set(report["comparisons"]) == {"2.4", "3.2"}
          for arm in report["arms"].values():
              assert arm["initial_stage"] == 2
              assert arm["steps"] == 600
              assert isinstance(arm["world_tick_delta"], int)
              assert arm["world_tick_delta"] >= 0
              assert arm["applied_decision_count"] + arm["discarded_decision_count"] == 600
              assert arm["action_overridden"] is False
              assert arm["live_published"] == 0
              assert arm["source_sha256"] == report["arms"]["1.6"]["source_sha256"]
          for row in report["comparisons"].values():
              assert row["repeat_study_required"] is True
              assert isinstance(row["exposure_comparable"], bool)
              if not row["exposure_comparable"]:
                  assert row["exploratory_signal_only"] is False
              assert row["production_promotion_authorized"] is False
          limits = report["claim_limits"]
          assert limits["production_checkpoint_mutated"] is False
          assert limits["production_gain_change_authorized"] is False
          assert limits["decoder_change_authorized"] is False
          assert limits["live_telemetry_published"] is False
          assert limits["stage2_improvement_verified"] is False
          print("STAGE2_DANGER_GAIN_AB_EVIDENCE_PASS", report["receipt_sha256"])
          for name, arm in report["arms"].items():
              print("ARM_EXPOSURE", name, "world_ticks", arm["world_tick_delta"],
                    "applied", arm["applied_decision_count"],
                    "discarded", arm["discarded_decision_count"])
          print(json.dumps(report["comparisons"], sort_keys=True))
          PY

      - name: Publish diagnostics only (never weights or checkpoint)
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-stage2-danger-gain-ab-${{ github.run_id }}
          path: |
            runs/stage2-danger-gain-ab/report.json
            runs/stage2-danger-gain-ab/gain-1.6/behavior-summary.json
            runs/stage2-danger-gain-ab/gain-2.4/behavior-summary.json
            runs/stage2-danger-gain-ab/gain-3.2/behavior-summary.json
          if-no-files-found: error
          retention-days: 3
