name: Research Food Responsive DN Scan

on:
  workflow_dispatch:
  push:
    branches:
      - research/walking-dn-population-audit
    paths:
      - "scripts/research_scan_food_responsive_dns.py"
      - ".github/workflows/research-food-responsive-dn-scan.yml"

permissions:
  contents: read

jobs:
  food-responsive-dn-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      STONKFLY_DATA: /home/runner/.cache/neurofly/stonkfly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore prepared MaleCNS cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}
      - name: Install pinned Stonkfly integration
        run: python -m pip install -e '.[stonkfly]'
      - name: Prepare and verify MaleCNS
        run: |
          mkdir -p "$STONKFLY_DATA"
          python -m stonkfly prepare
          python -m stonkfly verify
      - name: Scan all descending-neuron types for food response
        run: python scripts/research_scan_food_responsive_dns.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: food-responsive-dn-scan
          path: artifacts/food_responsive_dn_scan.json
          if-no-files-found: error
