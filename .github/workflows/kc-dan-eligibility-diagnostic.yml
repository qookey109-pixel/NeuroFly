name: NeuroFly KC-DAN Eligibility Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: neurofly-kc-dan-eligibility-diagnostic
  cancel-in-progress: false

jobs:
  kc-dan-eligibility-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      STONKFLY_DATA: /home/runner/.cache/neurofly/stonkfly
      SOURCE_STATE: runs/free-malecns
      STUDY_DIR: runs/kc-dan-eligibility-diagnostic
      BASE_CHECKPOINT: runs/kc-dan-eligibility-diagnostic/base-brain.npz
      RECEIPT: runs/kc-dan-eligibility-diagnostic/kc-dan-eligibility-diagnostic-receipt.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore prepared MaleCNS cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}

      - name: Restore latest production checkpoint read-only source
        uses: actions/cache/restore@v4
        with:
          path: runs/free-malecns
          key: neurofly-v06-state-kc-dan-diagnostic-${{ github.run_id }}
          restore-keys: |
            neurofly-v06-state-

      - name: Install pinned Stonkfly integration
        run: python -m pip install -e '.[test,stonkfly]'

      - name: Prepare and verify MaleCNS
        run: |
          mkdir -p "$STONKFLY_DATA" "$STUDY_DIR"
          python -m stonkfly prepare
          python -m neurofly brain-status
          python -m neurofly host-preflight | tee "$STUDY_DIR/preflight.json"

      - name: Copy production brain into isolated diagnostic baseline
        run: |
          test -f "$SOURCE_STATE/brain.npz"
          cp "$SOURCE_STATE/brain.npz" "$BASE_CHECKPOINT"
          test "$(realpath "$SOURCE_STATE/brain.npz")" != "$(realpath "$BASE_CHECKPOINT")"
          sha256sum "$SOURCE_STATE/brain.npz" "$BASE_CHECKPOINT"

      - name: Execute per-bin KC-DAN eligibility diagnostic
        run: |
          python -m neurofly.kc_dan_eligibility_diagnostic \
            --base-checkpoint "$BASE_CHECKPOINT" \
            --output-dir "$STUDY_DIR/replicates" \
            --receipt "$RECEIPT"

      - name: Validate diagnostic receipt without opening claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path(
                  "runs/kc-dan-eligibility-diagnostic/"
                  "kc-dan-eligibility-diagnostic-receipt.json"
              ).read_text()
          )
          assert receipt["schema"] == "neurofly-kc-dan-eligibility-diagnostic-receipt-v0.1"
          assert receipt["status"] == "EXPLORATORY_DIAGNOSTIC_COMPLETE"
          assert receipt["execution_valid"] is True
          assert all(receipt["config_gates"].values())
          assert all(receipt["evidence_gates"].values())
          assert receipt["learning_validated"] is False
          assert receipt["kc_dan_temporal_drive_causal"] is False
          assert receipt["dan_trace_state_mismatch_causal"] is False
          assert receipt["causal_learning_claim_authorized"] is False
          assert receipt["replacement_confirmatory_authorized"] is False
          assert receipt["behavioral_promotion_authorized"] is False
          print(
              "KC_DAN_ELIGIBILITY_DIAGNOSTIC_VALID",
              receipt["receipt_sha256"],
              receipt["aggregate"],
          )
          PY

      - name: Publish diagnostic evidence only
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-kc-dan-eligibility-${{ github.run_id }}
          path: |
            runs/kc-dan-eligibility-diagnostic/preflight.json
            runs/kc-dan-eligibility-diagnostic/kc-dan-eligibility-diagnostic-receipt.json
          if-no-files-found: error
          retention-days: 7
