name: NeuroFly Stage 2 Live Odor-Action Audit

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/stage2-odor-action-audit.yml"
      - "scripts/stage2_odor_action_audit.py"
      - "src/neurofly/odor_behavior_audit.py"
      - "tests/test_odor_behavior_audit.py"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: neurofly-stage2-live-odor-action-audit
  cancel-in-progress: true

jobs:
  published-trajectory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current verified publication
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline audit only
        run: python -m pip install -e '.[test]'
      - name: Verify audit guardrails
        run: python -m pytest -q tests/test_odor_behavior_audit.py
      - name: Inspect current published trajectory without runtime changes
        run: |
          python scripts/stage2_odor_action_audit.py \
            --source site/malecns-state.json \
            --output runs/stage2-odor-action-audit/audit.json
      - name: Assert non-promotion and report provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("runs/stage2-odor-action-audit/audit.json").read_text())
          assert report["schema"] == "neurofly-stage2-live-odor-action-audit-v1"
          assert report["curriculum_stage"] == 2
          assert report["counts"]["all"]["decisions"] > 0
          assert report["claim_limits"]["stage2_improvement_verified"] is False
          assert report["claim_limits"]["production_gain_change_authorized"] is False
          assert report["claim_limits"]["decoder_change_authorized"] is False
          print("STAGE2_ODOR_ACTION_PROVENANCE_PASS", report["published_source_sha256"])
          PY
      - name: Publish small read-only diagnostic receipt
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-stage2-odor-action-audit-${{ github.run_id }}
          path: runs/stage2-odor-action-audit/audit.json
          retention-days: 3
          if-no-files-found: error
