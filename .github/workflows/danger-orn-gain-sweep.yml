name: NeuroFly Danger ORN Gain Sweep

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/danger-orn-gain-sweep.yml"
      - "scripts/danger_orn_gain_sweep.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: neurofly-danger-orn-gain-sweep
  cancel-in-progress: false

jobs:
  isolated-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STONKFLY_DATA: /home/runner/.cache/neurofly/stonkfly
      SOURCE_CHECKPOINT: runs/free-malecns/brain.npz
      OUTPUT: runs/danger-gain-sweep/danger-orn-gain-sweep.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore MaleCNS data
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}

      - name: Restore source production checkpoint without saving
        uses: actions/cache/restore@v4
        with:
          path: runs/free-malecns
          key: neurofly-v06-state-danger-sweep-${{ github.run_id }}
          restore-keys: |
            neurofly-v06-state-

      - name: Install pinned Stonkfly
        run: python -m pip install -e '.[test,stonkfly]'

      - name: Prepare MaleCNS and checkpoint
        run: |
          mkdir -p "$STONKFLY_DATA" "$(dirname "$OUTPUT")"
          python -m stonkfly prepare
          python -m neurofly brain-status
          test -f "$SOURCE_CHECKPOINT"

      - name: Measure isolated danger ORN gain response
        run: |
          python scripts/danger_orn_gain_sweep.py \
            --source-checkpoint "$SOURCE_CHECKPOINT" \
            --output "$OUTPUT"

      - name: Validate source immutability and non-promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("runs/danger-gain-sweep/danger-orn-gain-sweep.json").read_text())
          assert report["schema"] == "neurofly-danger-orn-gain-sweep-v1"
          assert report["status"] == "PASS"
          assert report["source_checkpoint_unchanged"] is True
          assert report["production_checkpoint_mutated"] is False
          assert report["production_code_modified"] is False
          assert report["learning_enabled"] is False
          assert report["maze_actions_executed"] is False
          assert report["sweep_gains"] == [1.6, 2.4, 3.2]
          # Check measured decoded actions, not just changes in DN firing.
          for gain in ("1.6", "2.4", "3.2"):
            side_margins = []
            for condition, expected_away in (
              ("danger_left", "TURN_RIGHT"),
              ("danger_right", "TURN_LEFT"),
            ):
              metric = report["danger_conditions"][gain][condition]["decoded_turns"]
              assert metric["decision_count"] == 24
              assert metric["expected_away_turn"] == expected_away
              assert sum(metric["action_counts"].values()) == 24
              assert 0 <= metric["turn_fraction"] <= 1
              assert -1 <= metric["net_away_minus_toward_fraction"] <= 1
              side_margins.append(metric["net_away_minus_toward_fraction"])
            observed = report["action_avoidance_proxy"][gain][
              "mean_net_away_minus_toward_fraction"
            ]
            assert abs(observed - sum(side_margins) / 2) < 1e-12
          assert report["claim_limits"]["live_maze_avoidance_verified"] is False
          assert report["claim_limits"]["production_gain_change_authorized"] is False
          assert report["claim_limits"]["behavioral_improvement_verified"] is False
          print("DANGER_ORN_GAIN_RECEIPT_PASS", report["receipt_sha256"])
          print(json.dumps(report["signed_contrasts"], sort_keys=True))
          PY

      - name: Upload experimental evidence only
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-danger-gain-sweep-${{ github.run_id }}
          path: runs/danger-gain-sweep/danger-orn-gain-sweep.json
          if-no-files-found: error
          retention-days: 2
