name: Research FANC Legacy Root Bridge Audit

on:
  pull_request:
    paths:
      - "scripts/research_probe_fanc_root_bridge.py"
      - ".github/workflows/research-fanc-root-bridge.yml"
      - "tests/test_fanc_root_bridge_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fanc-root-bridge-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run read-only FANC root bridge audit
        run: |
          python scripts/research_probe_fanc_root_bridge.py \
            --output artifacts/fanc_root_bridge_audit.json

      - name: Upload evidence receipt
        uses: actions/upload-artifact@v4
        with:
          name: fanc-root-bridge-audit
          path: artifacts/fanc_root_bridge_audit.json
          if-no-files-found: error
          retention-days: 30
