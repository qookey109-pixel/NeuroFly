name: Research Public FANC Meta Export Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/v1-feco-public-fanc-meta-export-audit
    paths:
      - "scripts/research_probe_public_fanc_meta_export.py"
      - "tests/test_public_fanc_meta_export_contract.py"
      - "docs/experiments/V1_PUBLIC_FANC_META_EXPORT_AUDIT.md"
      - ".github/workflows/research-public-fanc-meta-export-audit.yml"
  pull_request:
    paths:
      - "scripts/research_probe_public_fanc_meta_export.py"
      - "tests/test_public_fanc_meta_export_contract.py"
      - "docs/experiments/V1_PUBLIC_FANC_META_EXPORT_AUDIT.md"
      - ".github/workflows/research-public-fanc-meta-export-audit.yml"

permissions:
  contents: read

jobs:
  public-fanc-meta-export-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check pytest pyarrow
      - name: Contract test
        run: python -m pytest -q tests/test_public_fanc_meta_export_contract.py
      - name: Probe public FANC metadata exports
        run: |
          python scripts/research_probe_public_fanc_meta_export.py \
            --output artifacts/public_fanc_meta_export_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-fanc-meta-export-audit
          path: artifacts/public_fanc_meta_export_audit.json
          if-no-files-found: warn
