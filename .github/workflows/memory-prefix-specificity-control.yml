name: NeuroFly Memory Prefix Specificity Control

on:
  workflow_dispatch:
  push:
    branches:
      - research/v1-memory-prefix-specificity-control
    paths:
      - "data/memory_prefix_specificity_control_v01.json"
      - "src/neurofly/memory_prefix_specificity_control.py"
      - "tests/test_memory_prefix_specificity_control.py"
      - "docs/experiments/V1_MEMORY_PREFIX_SPECIFICITY_CONTROL.md"
      - ".github/workflows/memory-prefix-specificity-control.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: neurofly-memory-prefix-specificity-control
  cancel-in-progress: true

jobs:
  memory-prefix-specificity-control:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      STONKFLY_DATA: /home/runner/.cache/neurofly/stonkfly
      SOURCE_STATE: runs/free-malecns
      STUDY_DIR: runs/memory-prefix-specificity-control
      BASE_CHECKPOINT: runs/memory-prefix-specificity-control/base-brain.npz
      RECEIPT: runs/memory-prefix-specificity-control/memory-prefix-specificity-control-receipt.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore prepared MaleCNS cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}

      - name: Restore latest production checkpoint read-only source
        uses: actions/cache/restore@v4
        with:
          path: runs/free-malecns
          key: neurofly-v06-state-memory-prefix-specificity-${{ github.run_id }}
          restore-keys: |
            neurofly-v06-state-

      - name: Install pinned Stonkfly integration
        run: python -m pip install -e '.[test,stonkfly]'

      - name: Validate preregistered contract
        run: pytest -q tests/test_memory_prefix_specificity_control.py

      - name: Prepare and verify MaleCNS
        run: |
          mkdir -p "$STONKFLY_DATA" "$STUDY_DIR"
          python -m stonkfly prepare
          python -m neurofly brain-status
          python -m neurofly host-preflight | tee "$STUDY_DIR/preflight.json"

      - name: Copy production brain into isolated baseline
        run: |
          test -f "$SOURCE_STATE/brain.npz"
          cp "$SOURCE_STATE/brain.npz" "$BASE_CHECKPOINT"
          test "$(realpath "$SOURCE_STATE/brain.npz")" != "$(realpath "$BASE_CHECKPOINT")"
          sha256sum "$SOURCE_STATE/brain.npz" "$BASE_CHECKPOINT"

      - name: Execute memory prefix specificity control
        run: |
          python -m neurofly.memory_prefix_specificity_control             --base-checkpoint "$BASE_CHECKPOINT"             --output-dir "$STUDY_DIR/replicates"             --receipt "$RECEIPT"

      - name: Validate evidence without opening claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "runs/memory-prefix-specificity-control/"
              "memory-prefix-specificity-control-receipt.json"
          )
          r = json.loads(p.read_text())
          assert r["schema"] == (
              "neurofly-memory-prefix-specificity-control-receipt-v0.1"
          )
          assert r["status"] == (
              "EXPLORATORY_MEMORY_PREFIX_SPECIFICITY_CONTROL_COMPLETE"
          )
          assert r["execution_valid"] is True
          assert all(r["config_gates"].values())
          assert all(r["evidence_gates"].values())
          for key in (
              "learning_validated",
              "temporal_cue_index_confirmed",
              "prefix_sequence_specificity_confirmed",
              "memory_expression_causal",
              "replacement_confirmatory_authorized",
              "behavioral_promotion_authorized",
          ):
              assert r[key] is False
          assert r["production_checkpoint_mutated"] is False
          print(
              "MEMORY_PREFIX_SPECIFICITY_CONTROL_VALID",
              r["receipt_sha256"],
              r["aggregate"],
          )
          PY

      - name: Publish prefix-specificity evidence only
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-memory-prefix-specificity-control-${{ github.run_id }}
          path: |
            runs/memory-prefix-specificity-control/preflight.json
            runs/memory-prefix-specificity-control/memory-prefix-specificity-control-receipt.json
          if-no-files-found: error
          retention-days: 14
