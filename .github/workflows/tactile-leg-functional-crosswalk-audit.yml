name: NeuroFly Tactile Leg Functional Crosswalk Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/tactile-leg-functional-crosswalk-audit.yml"
      - "data/tactile_leg_functional_crosswalk_v01.json"
      - "data/tactile_leg_functional_crosswalk_v02.json"
      - "src/neurofly/tactile_crosswalk_audit.py"
      - "tests/test_tactile_crosswalk_audit.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neurofly-tactile-leg-crosswalk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  malecns-tactile-leg-crosswalk-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STONKFLY_DATA: /home/runner/.cache/neurofly/stonkfly
      CROSSWALK: data/tactile_leg_functional_crosswalk_v02.json
      AUDIT_OUTPUT: runs/somatosensation/tactile-leg-functional-crosswalk-audit.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore prepared MaleCNS cache read-only
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            malecns-v1-

      - name: Install pinned Stonkfly integration
        run: python -m pip install -e '.[test,stonkfly]'

      - name: Prepare or verify pinned MaleCNS
        run: |
          mkdir -p "$STONKFLY_DATA" "$(dirname "$AUDIT_OUTPUT")"
          python -m stonkfly prepare
          python -m neurofly brain-status

      - name: Audit evidence-backed leg tactile types
        run: |
          python -m neurofly.tactile_crosswalk_audit \
            --crosswalk "$CROSSWALK" \
            --output "$AUDIT_OUTPUT"
          python - <<'PY'
          import json
          import os

          report = json.load(open(os.environ["AUDIT_OUTPUT"]))
          assert report["schema"] == "neurofly-tactile-leg-functional-crosswalk-audit-v1"
          assert report["crosswalk_schema"] == "neurofly-tactile-leg-functional-crosswalk-v0.2"
          assert report["crosswalk_type_count"] == 6
          assert report["crosswalk_types"] == [
              "SNta20", "SNta26", "SNta27", "SNta28", "SNta34", "SNta37",
          ]
          assert report["stimulation_enabled"] is False
          assert report["runtime_transduction_enabled"] is False
          assert report["passed"] is True
          assert int(report["selected_leg_touch_candidates"]) == 590
          assert not report["missing_crosswalk_types"]
          assert not report["non_tactile_mapped_rows"]
          assert not report["disallowed_subclass_rows"]
          print(
              "TACTILE_LEG_FUNCTIONAL_CROSSWALK_AUDIT_PASS",
              "selected=", report["selected_leg_touch_candidates"],
              "types=", report["selected_type_counts"],
              "subclasses=", report["selected_subclass_counts"],
              "tiers=", report["evidence_tier_counts"],
              "ambiguous_unresolved=", report["ambiguous_related_rows_left_unresolved"],
          )
          PY

      - name: Publish compact tactile crosswalk evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-tactile-leg-crosswalk-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/somatosensation/tactile-leg-functional-crosswalk-audit.json
          if-no-files-found: warn
          retention-days: 3
