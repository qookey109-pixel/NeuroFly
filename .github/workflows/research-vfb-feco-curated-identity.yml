name: Research VFB Curated FeCO Identity Audit

on:
  pull_request:
    paths:
      - "scripts/research_probe_vfb_feco_curated_identity.py"
      - ".github/workflows/research-vfb-feco-curated-identity.yml"
      - "tests/test_vfb_feco_curated_identity_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vfb-curated-identity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run read-only VFBquery audit
        run: |
          python scripts/research_probe_vfb_feco_curated_identity.py \
            --output artifacts/vfb_curated_identity_audit.json

      - name: Upload evidence receipt
        uses: actions/upload-artifact@v4
        with:
          name: vfb-curated-feco-identity-audit
          path: artifacts/vfb_curated_identity_audit.json
          if-no-files-found: error
          retention-days: 30
