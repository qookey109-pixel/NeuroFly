name: Research Author EM-LM FeCO Identity Audit

on:
  pull_request:
    paths:
      - "scripts/research_probe_author_emlm_identity.py"
      - ".github/workflows/research-author-emlm-feco-identity.yml"
      - "tests/test_author_emlm_identity_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  author-emlm-identity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run read-only author EM-LM audit
        run: |
          python scripts/research_probe_author_emlm_identity.py \
            --output artifacts/author_emlm_identity_audit.json

      - name: Upload evidence receipt
        uses: actions/upload-artifact@v4
        with:
          name: author-emlm-feco-identity-audit
          path: artifacts/author_emlm_identity_audit.json
          if-no-files-found: error
          retention-days: 30
