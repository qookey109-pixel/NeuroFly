name: NeuroFly Curriculum Training

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/full-malecns-free.yml"
  workflow_dispatch:
    inputs:
      steps:
        description: "Number of real MaleCNS curriculum decisions"
        required: false
        default: "1200"
      continuous:
        description: "Continue onto the next checkpointed free runner after this run"
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: neurofly-v06-curriculum-training
  cancel-in-progress: false

jobs:
  self-train-malecns:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      STONKFLY_DATA: /home/runner/.cache/neurofly/stonkfly
      NEUROFLY_STATE: runs/free-malecns
      CHECKPOINT: runs/free-malecns/brain.npz
      RECEIPT: runs/free-malecns/self-training-receipt.json
      NEUROFLY_LIVE_RELAY_URL: https://neurofly-curriculum-relay.onrender.com

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Show free-runner resources
        run: |
          free -h || true
          df -h /

      - name: Restore prepared MaleCNS cache
        id: malecns-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}

      - name: Restore V0.6 state or migrate latest V0.5 state
        uses: actions/cache/restore@v4
        with:
          path: runs/free-malecns
          key: neurofly-v06-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            neurofly-v06-state-
            neurofly-state-

      - name: Install pinned Stonkfly integration
        run: python -m pip install -e '.[test,stonkfly]'

      - name: Prepare and verify MaleCNS
        run: |
          mkdir -p "$STONKFLY_DATA" "$NEUROFLY_STATE"
          python -m stonkfly prepare
          python -m neurofly brain-status
          python -m neurofly host-preflight | tee "$NEUROFLY_STATE/preflight.json"

      - name: Let MaleCNS train through staged curriculum
        id: train
        env:
          INPUT_STEPS: ${{ github.event_name == 'workflow_dispatch' && inputs.steps || '1200' }}
        run: |
          python -m neurofly.training \
            --curriculum \
            --steps "$INPUT_STEPS" \
            --playback-steps 240 \
            --checkpoint "$CHECKPOINT" \
            --receipt "$RECEIPT"

      # Persistence is part of the runtime authority. Save it immediately after
      # a successful neural run so a later site-state/publish failure can never
      # strand the continuous brain on a dead runner.
      - name: Save isolated V0.6 brain and curriculum state
        id: state-cache
        if: ${{ always() && steps.train.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: runs/free-malecns
          key: neurofly-v06-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build verified curriculum state
        id: build-state
        if: ${{ always() && steps.train.outcome == 'success' }}
        continue-on-error: true
        run: |
          python -m neurofly publish-site-state \
            --receipt "$RECEIPT" \
            --output site/malecns-state.json
          python - <<'PY'
          import json
          state = json.load(open('site/malecns-state.json'))
          assert state['verified'] is True
          assert state['backend'] == 'malecns'
          assert state['source_receipt_schema'] == 'neurofly-self-training-v3'
          assert state['goal'] == 'maze_cleared'
          assert state['curriculum'] is True
          assert state['curriculum_version'] == 'neurofly-curriculum-v4'
          assert state['olfaction_model'] == 'neurofly-virtual-olfaction-v1'
          assert int(state['world_states_seen']) > 0
          assert state['trajectory']
          assert all(s['brain']['backend'] == 'malecns' for s in state['trajectory'])
          assert all(int(s['brain']['telemetry']['total_spikes']) > 0 for s in state['trajectory'])
          assert all(
              s['brain']['telemetry']['olfaction_model'] == 'neurofly-virtual-olfaction-v1'
              for s in state['trajectory']
          )
          assert all(
              s.get('olfaction', {}).get('model') == 'neurofly-virtual-olfaction-v1'
              for s in state['trajectory']
          )
          odor_report = state['olfaction']
          assert odor_report['model'] == 'neurofly-virtual-olfaction-v1'
          assert odor_report['food']['orn_type'] == 'ORN_DM1'
          assert odor_report['danger']['orn_type'] == 'ORN_DA2'
          for channel in ('food', 'danger'):
              report = odor_report[channel]
              assert report['side_policy'] == 'somaSide_then_curated_instance_suffix'
              assert int(report['type_neurons']) > 0
              assert int(report['left_neurons']) > 0
              assert int(report['right_neurons']) > 0
              assert int(report['left_neurons']) + int(report['right_neurons']) <= int(report['type_neurons'])
              assert int(report['unresolved_side']) >= 0
          assert sum(
              int(s['brain']['telemetry'].get('food_odor_spikes', 0))
              for s in state['trajectory']
          ) > 0
          assert all(
              int(s['brain']['telemetry'].get('danger_odor_spikes', -1)) >= 0
              for s in state['trajectory']
          )
          final = state['final_state']
          stage = int(final['curriculum_stage'])
          assert 1 <= stage <= 4
          assert final['curriculum_stage_name']
          assert final['curriculum_version'] == 'neurofly-curriculum-v4'
          assert int(final.get('total_world_ticks', 0)) > 0
          assert final.get('olfaction', {}).get('model') == 'neurofly-virtual-olfaction-v1'
          assert final.get('action_autonomy_policy') == 'neurofly-sensory-only-action-autonomy-v1'
          assert final.get('direct_action_override_enabled') is False
          assert final.get('stall_stimulus_policy') == 'neurofly-nondirectional-stall-aversive-hf-v3'
          assert float(final.get('stall_stimulus_frequency_hz', 0.0)) == 200.0
          assert int(final.get('stall_stimulus_pulses_per_decision', 0)) == 10
          decision_states = [
              sample for sample in state['trajectory']
              if sample.get('decision_applied') is True
          ]
          assert decision_states
          assert all(
              sample.get('raw_brain_action') == sample.get('applied_action')
              and sample.get('action_overridden') is False
              and sample.get('override_reason') is None
              for sample in decision_states
          )
          enemies = len(final.get('enemies', []))
          if stage == 1:
              assert final['curriculum_stage_name'] == 'full-maze-foraging'
              assert enemies == 0
          else:
              assert enemies >= 1
          print(
              'CURRICULUM_V4_SENSORY_ONLY_GATE_PASS',
              state['source_receipt_sha256'],
              'stage=', stage,
              'stage_name=', final['curriculum_stage_name'],
              'food=', final.get('total_food', 0),
              'clears=', final.get('total_clears', 0),
              'deaths=', final.get('total_deaths', 0),
              'enemies=', len(final.get('enemies', [])),
              'world_states=', state['world_states_seen'],
              'food_orn=', odor_report['food'],
              'danger_orn=', odor_report['danger'],
          )
          PY

      - name: Warn if verified curriculum state could not be built
        if: ${{ always() && steps.train.outcome == 'success' && steps.build-state.outcome != 'success' }}
        run: echo "::warning::MaleCNS checkpoint was saved, but verified site-state validation failed. Continuous runtime will continue from the saved brain."

      - name: Publish latest verified curriculum trajectory to main
        id: publish-state
        if: ${{ always() && steps.build-state.outcome == 'success' }}
        continue-on-error: true
        run: |
          AUTHORITY_BRANCH=main
          RUN_SOURCE_SHA="$GITHUB_SHA"
          cp site/malecns-state.json /tmp/neurofly-malecns-state.json
          git config user.name "neurofly-bot"
          git config user.email "neurofly-bot@users.noreply.github.com"
          git fetch origin "$AUTHORITY_BRANCH"
          CURRENT_AUTHORITY_SHA="$(git rev-parse "origin/$AUTHORITY_BRANCH")"
          if [ "$CURRENT_AUTHORITY_SHA" != "$RUN_SOURCE_SHA" ]; then
            echo "::warning::Authority main advanced during this training run; skip stale verified-state publish. run_source=${RUN_SOURCE_SHA} current_main=${CURRENT_AUTHORITY_SHA}"
            exit 1
          fi
          git checkout -B "$AUTHORITY_BRANCH" "origin/$AUTHORITY_BRANCH"
          cp /tmp/neurofly-malecns-state.json site/malecns-state.json
          git add site/malecns-state.json
          if git diff --cached --quiet; then
            echo "Verified curriculum state is unchanged."
          else
            git commit -m "state: publish verified MaleCNS curriculum trajectory"
            git push origin "HEAD:${AUTHORITY_BRANCH}"
          fi

      - name: Warn if verified state could not be published
        if: ${{ always() && steps.build-state.outcome == 'success' && steps.publish-state.outcome != 'success' }}
        run: echo "::warning::Verified state publish failed, but the checkpoint is safe and continuous runtime may continue."

      # GITHUB_TOKEN-authored pushes do not recursively trigger normal push
      # workflows or GitHub Pages builds. workflow_dispatch is an explicit
      # documented exception, so hand the verified main snapshot to Pages
      # directly after the publish step succeeds.
      - name: Refresh GitHub Pages from verified main state
        id: refresh-pages
        if: ${{ always() && steps.build-state.outcome == 'success' && steps.publish-state.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            if gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
              -f ref=main; then
              echo "PAGES_REFRESH_DISPATCH_OK attempt=${attempt}"
              exit 0
            fi
            echo "::warning::Pages refresh dispatch attempt ${attempt}/3 failed."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "::error::Pages refresh dispatch failed after 3 attempts; verified state remains safe on main."
          exit 1

      - name: Warn if Pages refresh dispatch failed
        if: ${{ always() && steps.refresh-pages.outcome == 'failure' }}
        run: echo "::warning::Verified MaleCNS state is safely published on main, but GitHub Pages refresh dispatch failed. The runtime chain may continue."

      - name: Check dataset cache size
        id: dataset-size
        if: ${{ always() && steps.train.outcome == 'success' }}
        shell: bash
        run: |
          bytes=$(du -sb "$STONKFLY_DATA" | cut -f1)
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          if [ "$bytes" -lt 9000000000 ]; then
            echo "cacheable=true" >> "$GITHUB_OUTPUT"
          else
            echo "cacheable=false" >> "$GITHUB_OUTPUT"
            echo "MaleCNS cache is above the 9 GB safety ceiling; skip cache save."
          fi

      - name: Save prepared MaleCNS cache
        if: ${{ always() && steps.train.outcome == 'success' && steps.malecns-cache.outputs.cache-hit != 'true' && steps.dataset-size.outputs.cacheable == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}

      - name: Publish compact evidence
        if: ${{ always() && steps.train.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-v06-curriculum-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runs/free-malecns/preflight.json
            runs/free-malecns/self-training-receipt.json
            site/malecns-state.json
          if-no-files-found: warn
          retention-days: 1

      - name: Read continuous runtime policy
        id: runtime-policy
        if: ${{ always() && steps.train.outcome == 'success' && steps.state-cache.outcome == 'success' }}
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:config/neurofly_continuous_runtime.json > /tmp/neurofly-continuous-runtime.json
          python - <<'PY'
          import json
          import os

          policy = json.load(open('/tmp/neurofly-continuous-runtime.json'))
          assert policy['schema'] == 'neurofly-continuous-runtime-v1'
          assert policy['authority_branch'] == 'main'
          assert policy['runner'] == 'ubuntu-latest'
          assert policy['paid_resources'] is False
          steps = int(policy['steps_per_run'])
          assert 1 <= steps <= 5000
          enabled = bool(policy['enabled'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"enabled={'true' if enabled else 'false'}\n")
              output.write(f"steps={steps}\n")
          print('CONTINUOUS_RUNTIME_POLICY', 'enabled=', enabled, 'steps=', steps)
          PY

      - name: Continue NeuroFly on next free runner
        id: continue-runtime
        if: ${{ always() && steps.train.outcome == 'success' && steps.state-cache.outcome == 'success' && steps.runtime-policy.outcome == 'success' && steps.runtime-policy.outputs.enabled == 'true' && (github.event_name != 'workflow_dispatch' || inputs.continuous) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_STEPS: ${{ steps.runtime-policy.outputs.steps }}
        shell: bash
        run: |
          set -u
          echo "Checkpoint is safely persisted. Dispatching the next NeuroFly runner with ${NEXT_STEPS} decisions."
          for attempt in 1 2 3; do
            if gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/full-malecns-free.yml/dispatches" \
              -f ref=main \
              -f "inputs[steps]=${NEXT_STEPS}" \
              -f "inputs[continuous]=true"; then
              echo "CONTINUOUS_RUNTIME_DISPATCH_OK attempt=${attempt}"
              exit 0
            fi
            echo "::warning::Continuation dispatch attempt ${attempt}/3 failed."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "::error::Continuation dispatch failed after 3 attempts; the watchdog will recover the chain."
          exit 1

      - name: Warn if runtime continuation dispatch failed
        if: ${{ always() && steps.continue-runtime.outcome == 'failure' }}
        run: echo "::warning::MaleCNS training and checkpoint persistence succeeded, but runner handoff failed. NeuroFly Runtime Watchdog will retry from the persisted checkpoint."
