name: NeuroFly Self Training

on:
  push:
    branches: ["feature/v0.5-self-training-goal"]
    paths:
      - ".github/workflows/full-malecns-free.yml"
  workflow_dispatch:
    inputs:
      steps:
        description: "Number of real MaleCNS training decisions"
        required: false
        default: "1200"

permissions:
  contents: write
  id-token: write

concurrency:
  group: neurofly-self-training
  cancel-in-progress: true

jobs:
  self-train-malecns:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      STONKFLY_DATA: /home/runner/.cache/neurofly/stonkfly
      NEUROFLY_STATE: runs/free-malecns
      CHECKPOINT: runs/free-malecns/brain.npz
      RECEIPT: runs/free-malecns/self-training-receipt.json
      NEUROFLY_LIVE_RELAY_URL: https://neurofly-live-relay.onrender.com

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Show free-runner resources
        run: |
          free -h || true
          df -h /

      - name: Restore prepared MaleCNS cache
        id: malecns-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}

      - name: Restore latest NeuroFly brain and maze state
        uses: actions/cache/restore@v4
        with:
          path: runs/free-malecns
          key: neurofly-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            neurofly-state-

      - name: Install pinned Stonkfly integration
        run: python -m pip install -e '.[test,stonkfly]'

      - name: Prepare and verify MaleCNS
        run: |
          mkdir -p "$STONKFLY_DATA" "$NEUROFLY_STATE"
          python -m stonkfly prepare
          python -m neurofly brain-status
          python -m neurofly host-preflight | tee "$NEUROFLY_STATE/preflight.json"

      - name: Let MaleCNS train itself toward maze clear
        env:
          INPUT_STEPS: ${{ inputs.steps || '1200' }}
        run: |
          python -m neurofly.training \
            --steps "$INPUT_STEPS" \
            --playback-steps 240 \
            --checkpoint "$CHECKPOINT" \
            --receipt "$RECEIPT"

      - name: Build verified game state
        run: |
          python -m neurofly publish-site-state \
            --receipt "$RECEIPT" \
            --output site/malecns-state.json
          python - <<'PY'
          import json
          state = json.load(open('site/malecns-state.json'))
          assert state['verified'] is True
          assert state['backend'] == 'malecns'
          assert state['source_receipt_schema'] == 'neurofly-self-training-v1'
          assert state['goal'] == 'maze_cleared'
          assert state['trajectory']
          assert all(s['brain']['backend'] == 'malecns' for s in state['trajectory'])
          assert all(int(s['brain']['telemetry']['total_spikes']) > 0 for s in state['trajectory'])
          final = state['final_state']
          print(
              'SELF_TRAINING_GATE_PASS',
              state['source_receipt_sha256'],
              'clears=', final.get('total_clears', 0),
              'deaths=', final.get('total_deaths', 0),
          )
          PY

      - name: Publish latest verified trajectory to visualizer branch
        run: |
          cp site/malecns-state.json /tmp/neurofly-malecns-state.json
          git config user.name "neurofly-bot"
          git config user.email "neurofly-bot@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          cp /tmp/neurofly-malecns-state.json site/malecns-state.json
          git add site/malecns-state.json
          if git diff --cached --quiet; then
            echo "Verified game state is unchanged."
          else
            git commit -m "state: publish self-trained MaleCNS trajectory [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Check dataset cache size
        id: dataset-size
        shell: bash
        run: |
          bytes=$(du -sb "$STONKFLY_DATA" | cut -f1)
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          if [ "$bytes" -lt 9000000000 ]; then
            echo "cacheable=true" >> "$GITHUB_OUTPUT"
          else
            echo "cacheable=false" >> "$GITHUB_OUTPUT"
            echo "MaleCNS cache is above the 9 GB safety ceiling; skip cache save."
          fi

      - name: Save prepared MaleCNS cache
        if: steps.malecns-cache.outputs.cache-hit != 'true' && steps.dataset-size.outputs.cacheable == 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}

      - name: Save resumable NeuroFly brain and maze state
        uses: actions/cache/save@v4
        with:
          path: runs/free-malecns
          key: neurofly-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish compact evidence
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-self-training-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runs/free-malecns/preflight.json
            runs/free-malecns/self-training-receipt.json
            site/malecns-state.json
          retention-days: 1
