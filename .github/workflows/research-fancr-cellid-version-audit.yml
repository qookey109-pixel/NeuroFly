name: Research fancr Cell-ID Version Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/v1-feco-fancr-cellid-version-audit
    paths:
      - "scripts/research_probe_fancr_cellid_versions.py"
      - "tests/test_fancr_cellid_version_contract.py"
      - "docs/experiments/V1_FANCR_CELLID_VERSION_AUDIT.md"
      - ".github/workflows/research-fancr-cellid-version-audit.yml"
  pull_request:
    paths:
      - "scripts/research_probe_fancr_cellid_versions.py"
      - "tests/test_fancr_cellid_version_contract.py"
      - "docs/experiments/V1_FANCR_CELLID_VERSION_AUDIT.md"
      - ".github/workflows/research-fancr-cellid-version-audit.yml"

permissions:
  contents: read

jobs:
  fancr-cellid-version-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Contract test
        run: python -m pytest -q tests/test_fancr_cellid_version_contract.py
      - name: Run exact FANC version audit
        run: |
          python scripts/research_probe_fancr_cellid_versions.py \
            --output artifacts/fancr_cellid_version_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fancr-cellid-version-audit
          path: artifacts/fancr_cellid_version_audit.json
          if-no-files-found: warn
