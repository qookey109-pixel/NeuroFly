name: NeuroFly SNpp39 SNpp41 Polarity Crosswalk Audit

on:
  pull_request:
    paths:
      - "src/neurofly/proprioception_polarity_crosswalk_audit.py"
      - "tests/test_proprioception_polarity_crosswalk_audit.py"
      - "docs/experiments/V011_SNPP39_SNPP41_POLARITY_CROSSWALK_AUDIT.md"
      - ".github/workflows/snpp39-snpp41-polarity-crosswalk-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  polarity-crosswalk-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUDIT_OUTPUT: runs/somatosensation/snpp39-snpp41-polarity-crosswalk-audit.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install NeuroFly test dependencies and Feather reader
        run: python -m pip install -e '.[test]' 'pyarrow==21.0.0'
      - name: Run unit gate
        run: pytest -q tests/test_proprioception_polarity_crosswalk_audit.py
      - name: Discover or verify exact FANC-to-BANC polarity crosswalk
        run: |
          mkdir -p "$(dirname "$AUDIT_OUTPUT")"
          python -m neurofly.proprioception_polarity_crosswalk_audit --output "$AUDIT_OUTPUT"
      - name: Publish polarity crosswalk receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-snpp39-snpp41-polarity-crosswalk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AUDIT_OUTPUT }}
          if-no-files-found: warn
          retention-days: 3
