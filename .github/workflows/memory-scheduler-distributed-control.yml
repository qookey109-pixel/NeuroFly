name: NeuroFly Memory Scheduler Distributed Control

on:
  workflow_dispatch:
  push:
    branches:
      - research/v1-memory-scheduler-distributed-control
    paths:
      - "data/memory_scheduler_distributed_control_v01.json"
      - "src/neurofly/memory_scheduler_distributed_control.py"
      - "tests/test_memory_scheduler_distributed_control.py"
      - "docs/experiments/V1_MEMORY_SCHEDULER_DISTRIBUTED_CONTROL.md"
      - ".github/workflows/memory-scheduler-distributed-control.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: neurofly-memory-scheduler-distributed-control
  cancel-in-progress: true

jobs:
  memory-scheduler-distributed-control:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      STONKFLY_DATA: /home/runner/.cache/neurofly/stonkfly
      SOURCE_STATE: runs/free-malecns
      STUDY_DIR: runs/memory-scheduler-distributed-control
      BASE_CHECKPOINT: runs/memory-scheduler-distributed-control/base-brain.npz
      RECEIPT: runs/memory-scheduler-distributed-control/memory-scheduler-distributed-control-receipt.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore prepared MaleCNS cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}

      - name: Restore latest production checkpoint read-only source
        uses: actions/cache/restore@v4
        with:
          path: runs/free-malecns
          key: neurofly-v06-state-memory-scheduler-distributed-${{ github.run_id }}
          restore-keys: |
            neurofly-v06-state-

      - name: Install pinned Stonkfly integration
        run: python -m pip install -e '.[test,stonkfly]'

      - name: Validate preregistered contract
        run: pytest -q tests/test_memory_scheduler_distributed_control.py

      - name: Prepare and verify MaleCNS
        run: |
          mkdir -p "$STONKFLY_DATA" "$STUDY_DIR"
          python -m stonkfly prepare
          python -m neurofly brain-status
          python -m neurofly host-preflight | tee "$STUDY_DIR/preflight.json"

      - name: Copy production brain into isolated baseline
        run: |
          test -f "$SOURCE_STATE/brain.npz"
          cp "$SOURCE_STATE/brain.npz" "$BASE_CHECKPOINT"
          test "$(realpath "$SOURCE_STATE/brain.npz")" != "$(realpath "$BASE_CHECKPOINT")"
          sha256sum "$SOURCE_STATE/brain.npz" "$BASE_CHECKPOINT"

      - name: Execute scheduler distributed control
        run: |
          python -m neurofly.memory_scheduler_distributed_control \
            --base-checkpoint "$BASE_CHECKPOINT" \
            --output-dir "$STUDY_DIR/replicates" \
            --receipt "$RECEIPT"

      - name: Validate evidence without opening claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("runs/memory-scheduler-distributed-control/memory-scheduler-distributed-control-receipt.json")
          r=json.loads(p.read_text())
          assert r["schema"]=="neurofly-memory-scheduler-distributed-control-receipt-v0.1"
          assert r["status"]=="EXPLORATORY_MEMORY_SCHEDULER_DISTRIBUTED_CONTROL_COMPLETE"
          assert r["execution_valid"] is True
          assert all(r["config_gates"].values())
          assert all(r["evidence_gates"].values())
          for key in (
              "learning_validated","temporal_cue_index_confirmed","prefix_sequence_specificity_confirmed",
              "transient_state_carrier_confirmed","memory_expression_causal",
              "replacement_confirmatory_authorized","behavioral_promotion_authorized",
          ):
              assert r[key] is False
          assert r["production_checkpoint_mutated"] is False
          print("MEMORY_SCHEDULER_DISTRIBUTED_CONTROL_VALID",r["receipt_sha256"],r["aggregate"])
          PY

      - name: Publish evidence only
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-memory-scheduler-distributed-control-${{ github.run_id }}
          path: |
            runs/memory-scheduler-distributed-control/preflight.json
            runs/memory-scheduler-distributed-control/memory-scheduler-distributed-control-receipt.json
          if-no-files-found: error
          retention-days: 14
