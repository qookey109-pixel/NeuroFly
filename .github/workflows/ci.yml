name: NeuroFly CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: CLI smoke test
        run: |
          python -m neurofly ideas
          python -m neurofly upstream-status
          python -m neurofly brain-status
          python -m neurofly maze-run --brain demo --steps 3 --interval 0 --checkpoint ""
          set +e
          python -m neurofly host-preflight >/tmp/neurofly-preflight.json
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q '"ready": false' /tmp/neurofly-preflight.json
      - name: Tests
        run: pytest -q

  site-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: python -m pip install -e .
      - name: Validate MaleCNS-only static site
        run: |
          test -f site/index.html
          test -f site/styles.css
          test -f site/app.js
          test -f site/malecns-state.json
          node --check site/app.js
          grep -q '"verified": false' site/malecns-state.json
          grep -q 'No demo agent is allowed' site/app.js
          grep -q 'WAITING MALECNS' site/index.html
          ! grep -q 'startDemo' site/app.js
      - name: Serve demo backend only as API contract fixture
        run: |
          python -m neurofly maze-server --brain demo --host 127.0.0.1 --port 8765 --tick-seconds 0.1 --checkpoint "" >/tmp/neurofly-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8765/ | grep -q "Maze Chase Lab"
          curl --fail --silent --show-error http://127.0.0.1:8765/api/status | grep -q '"backend":"demo"'
          curl --fail --silent --show-error http://127.0.0.1:8765/api/state | grep -q '"grid"'
          echo 'The website must reject this demo backend; this step only checks the server API contract.'

  free-runner-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate zero-cost full-brain profile
        run: |
          test ! -f render.yaml
          test -f .github/workflows/full-malecns-free.yml
          grep -q 'runs-on: ubuntu-latest' .github/workflows/full-malecns-free.yml
          grep -q 'timeout-minutes: 330' .github/workflows/full-malecns-free.yml
          grep -q 'actions/cache/restore@v4' .github/workflows/full-malecns-free.yml
          grep -q 'actions/cache/save@v4' .github/workflows/full-malecns-free.yml
          grep -q '9000000000' .github/workflows/full-malecns-free.yml
          grep -q 'publish-site-state' .github/workflows/full-malecns-free.yml
          grep -q 'contents: write' .github/workflows/full-malecns-free.yml
          ! grep -q '2c-16g' .github/workflows/full-malecns-free.yml

  stonkfly-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned Stonkfly integration
        run: python -m pip install -e '.[stonkfly]'
      - name: Verify import contract without downloading MaleCNS data
        run: |
          python - <<'PY'
          from stonkfly.neural.visual import VisualMemoryBrain
          from neurofly.brain_runtime import MaleCNSBrain, brain_status
          from neurofly.preflight import collect_preflight
          status = brain_status()
          preflight = collect_preflight()
          assert status["installed"] is True
          assert status["prepared"] is False
          assert preflight["ready"] is False
          assert VisualMemoryBrain is not None
          assert MaleCNSBrain is not None
          print(status)
          PY
