name: NeuroFly Memory Trace Reconstruction Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/v1-memory-trace-reconstruction
    paths:
      - "data/memory_trace_reconstruction_audit_v01.json"
      - "src/neurofly/memory_trace_reconstruction_audit.py"
      - "tests/test_memory_trace_reconstruction_audit.py"
      - "docs/experiments/V1_MEMORY_TRACE_RECONSTRUCTION_AUDIT.md"
      - ".github/workflows/memory-trace-reconstruction-audit.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: neurofly-memory-trace-reconstruction-audit
  cancel-in-progress: true

jobs:
  memory-trace-reconstruction-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      STONKFLY_DATA: /home/runner/.cache/neurofly/stonkfly
      SOURCE_STATE: runs/free-malecns
      STUDY_DIR: runs/memory-trace-reconstruction-audit
      BASE_CHECKPOINT: runs/memory-trace-reconstruction-audit/base-brain.npz
      RECEIPT: runs/memory-trace-reconstruction-audit/memory-trace-reconstruction-audit-receipt.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore prepared MaleCNS cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}

      - name: Restore latest production checkpoint read-only source
        uses: actions/cache/restore@v4
        with:
          path: runs/free-malecns
          key: neurofly-v06-state-memory-trace-reconstruction-${{ github.run_id }}
          restore-keys: |
            neurofly-v06-state-

      - name: Install pinned Stonkfly integration
        run: python -m pip install -e '.[test,stonkfly]'

      - name: Validate preregistered contract
        run: pytest -q tests/test_memory_trace_reconstruction_audit.py

      - name: Prepare and verify MaleCNS
        run: |
          mkdir -p "$STONKFLY_DATA" "$STUDY_DIR"
          python -m stonkfly prepare
          python -m neurofly brain-status
          python -m neurofly host-preflight | tee "$STUDY_DIR/preflight.json"

      - name: Copy production brain into isolated baseline
        run: |
          test -f "$SOURCE_STATE/brain.npz"
          cp "$SOURCE_STATE/brain.npz" "$BASE_CHECKPOINT"
          test "$(realpath "$SOURCE_STATE/brain.npz")" != "$(realpath "$BASE_CHECKPOINT")"
          sha256sum "$SOURCE_STATE/brain.npz" "$BASE_CHECKPOINT"

      - name: Execute memory trace reconstruction audit
        run: |
          python -m neurofly.memory_trace_reconstruction_audit             --base-checkpoint "$BASE_CHECKPOINT"             --output-dir "$STUDY_DIR/replicates"             --receipt "$RECEIPT"

      - name: Validate evidence without opening claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "runs/memory-trace-reconstruction-audit/"
              "memory-trace-reconstruction-audit-receipt.json"
          )
          r = json.loads(p.read_text())
          assert r["schema"] == (
              "neurofly-memory-trace-reconstruction-audit-receipt-v0.1"
          )
          assert r["status"] == "EXPLORATORY_TRACE_RECONSTRUCTION_AUDIT_COMPLETE"
          assert r["execution_valid"] is True
          assert all(r["config_gates"].values())
          assert all(r["evidence_gates"].values())
          for key in (
              "learning_validated",
              "temporal_cue_index_confirmed",
              "cue_indexing_failure_confirmed",
              "memory_expression_causal",
              "replacement_confirmatory_authorized",
              "behavioral_promotion_authorized",
          ):
              assert r[key] is False
          assert r["production_checkpoint_mutated"] is False
          print(
              "MEMORY_TRACE_RECONSTRUCTION_AUDIT_VALID",
              r["receipt_sha256"],
              r["aggregate"],
          )
          PY

      - name: Publish trace reconstruction evidence only
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-memory-trace-reconstruction-audit-${{ github.run_id }}
          path: |
            runs/memory-trace-reconstruction-audit/preflight.json
            runs/memory-trace-reconstruction-audit/memory-trace-reconstruction-audit-receipt.json
          if-no-files-found: error
          retention-days: 14
