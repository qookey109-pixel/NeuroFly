name: NeuroFly Runtime Watchdog

on:
  schedule:
    # Offset from common top-of-hour schedules; every 15 minutes.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: neurofly-runtime-watchdog
  cancel-in-progress: false

jobs:
  recover-continuous-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime authority
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read continuous runtime policy
        id: policy
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          policy = json.load(open('config/neurofly_continuous_runtime.json'))
          assert policy['schema'] == 'neurofly-continuous-runtime-v1'
          assert policy['authority_branch'] == 'main'
          assert policy['runner'] == 'ubuntu-latest'
          assert policy['paid_resources'] is False
          steps = int(policy['steps_per_run'])
          assert 1 <= steps <= 5000
          enabled = bool(policy['enabled'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"enabled={'true' if enabled else 'false'}\n")
              output.write(f"steps={steps}\n")
          print('WATCHDOG_RUNTIME_POLICY', 'enabled=', enabled, 'steps=', steps)
          PY

      - name: Inspect NeuroFly curriculum runners
        id: inspect
        if: ${{ steps.policy.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs_json="$(gh api --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/full-malecns-free.yml/runs" \
            -f per_page=20)"

          active="$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$runs_json")"
          latest_id="$(jq -r '.workflow_runs[0].id // 0' <<<"$runs_json")"
          latest_status="$(jq -r '.workflow_runs[0].status // "none"' <<<"$runs_json")"
          latest_conclusion="$(jq -r '.workflow_runs[0].conclusion // "none"' <<<"$runs_json")"
          latest_updated="$(jq -r '.workflow_runs[0].updated_at // empty' <<<"$runs_json")"

          age_seconds=999999
          if [ -n "$latest_updated" ]; then
            now_epoch="$(date -u +%s)"
            updated_epoch="$(date -u -d "$latest_updated" +%s)"
            age_seconds=$((now_epoch - updated_epoch))
            if [ "$age_seconds" -lt 0 ]; then
              age_seconds=0
            fi
          fi

          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "latest_id=$latest_id" >> "$GITHUB_OUTPUT"
          echo "latest_status=$latest_status" >> "$GITHUB_OUTPUT"
          echo "latest_conclusion=$latest_conclusion" >> "$GITHUB_OUTPUT"
          echo "age_seconds=$age_seconds" >> "$GITHUB_OUTPUT"

          echo "WATCHDOG_RUNTIME_STATUS active=$active latest_id=$latest_id latest_status=$latest_status latest_conclusion=$latest_conclusion age_seconds=$age_seconds"

      - name: Keep existing runner authority
        if: ${{ steps.policy.outputs.enabled == 'true' && steps.inspect.outputs.active != '0' }}
        run: echo "An active/queued NeuroFly curriculum runner already exists; watchdog will not dispatch another one."

      - name: Respect handoff visibility cooldown
        if: ${{ steps.policy.outputs.enabled == 'true' && steps.inspect.outputs.active == '0' && fromJSON(steps.inspect.outputs.age_seconds) < 180 }}
        run: echo "The latest curriculum run completed less than 3 minutes ago; allow GitHub's newly dispatched run to become visible before recovery."

      - name: Recover stopped continuous runtime
        if: ${{ steps.policy.outputs.enabled == 'true' && steps.inspect.outputs.active == '0' && fromJSON(steps.inspect.outputs.age_seconds) >= 180 }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_STEPS: ${{ steps.policy.outputs.steps }}
        shell: bash
        run: |
          set -u
          echo "No active NeuroFly curriculum runner is visible. Recovering from the latest persisted checkpoint with ${NEXT_STEPS} decisions."
          for attempt in 1 2 3; do
            if gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/full-malecns-free.yml/dispatches" \
              -f ref=main \
              -f "inputs[steps]=${NEXT_STEPS}" \
              -f "inputs[continuous]=true"; then
              echo "WATCHDOG_RECOVERY_DISPATCH_OK attempt=${attempt}"
              exit 0
            fi
            echo "::warning::Watchdog dispatch attempt ${attempt}/3 failed."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "::error::Watchdog could not dispatch a recovery runner. The next scheduled watchdog run will retry."
          exit 1

      - name: Continuous runtime intentionally disabled
        if: ${{ steps.policy.outputs.enabled != 'true' }}
        run: echo "Continuous NeuroFly runtime policy is disabled; watchdog will not start a runner."
