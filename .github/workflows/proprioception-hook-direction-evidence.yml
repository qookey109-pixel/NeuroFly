name: NeuroFly SNpp39 SNpp41 Hook Direction Evidence

on:
  pull_request:
    paths:
      - 'data/proprioception_hook_direction_evidence_v01.json'
      - 'src/neurofly/proprioception_hook_direction_evidence_audit.py'
      - 'tests/test_proprioception_hook_direction_evidence_audit.py'
      - 'docs/experiments/V011_SNPP39_SNPP41_HOOK_DIRECTION_EVIDENCE.md'
      - '.github/workflows/proprioception-hook-direction-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hook-direction-evidence:
    runs-on: ubuntu-24.04
    env:
      AUDIT_OUTPUT: runs/somatosensation/snpp39-snpp41-hook-direction-evidence.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install NeuroFly test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run unit gate
        run: pytest -q tests/test_proprioception_hook_direction_evidence_audit.py
      - name: Verify conservative hook direction evidence gate
        run: |
          mkdir -p "$(dirname "$AUDIT_OUTPUT")"
          python -m neurofly.proprioception_hook_direction_evidence_audit --output "$AUDIT_OUTPUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ['AUDIT_OUTPUT']).read_text())
          assert report['passed'] is True
          assert report['status'] == 'REVIEW_REQUIRED'
          assert report['direct_crosswalk_found'] is False
          assert report['direct_directional_tuning'] == {'SNpp39': None, 'SNpp41': None}
          assert report['circuit_consistent_hypotheses'] == {'SNpp39': 'extension', 'SNpp41': 'flexion'}
          assert report['current_calibration_authorized'] is False
          assert report['stimulation_enabled'] is False
          assert report['runtime_transduction_enabled'] is False
          assert report['promotion_ready'] is False
          PY
      - name: Publish hook direction evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-snpp39-snpp41-hook-direction-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AUDIT_OUTPUT }}
          if-no-files-found: warn
          retention-days: 3
