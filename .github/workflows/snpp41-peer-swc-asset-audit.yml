name: NeuroFly SNpp41 Peer SWC Asset Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/neurofly/proprioception_peer_swc_asset_audit.py"
      - "tests/test_proprioception_peer_swc_asset_audit.py"
      - ".github/workflows/snpp41-peer-swc-asset-audit.yml"
      - "docs/experiments/V011_SNPP41_PEER_SWC_ASSET_AUDIT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-swc-asset-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDIT_OUTPUT: runs/somatosensation/snpp41-peer-swc-asset-audit.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install NeuroFly test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run unit gate
        run: pytest -q tests/test_proprioception_peer_swc_asset_audit.py
      - name: Discover or verify 21 exact peer SWC assets
        run: |
          mkdir -p "$(dirname "$AUDIT_OUTPUT")"
          python -m neurofly.proprioception_peer_swc_asset_audit \
            --output "$AUDIT_OUTPUT"
      - name: Publish peer SWC asset receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-snpp41-peer-swc-asset-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AUDIT_OUTPUT }}
          if-no-files-found: warn
          retention-days: 3
