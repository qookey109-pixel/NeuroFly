name: NeuroFly SNpp41 Peer Morphology Source Inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/neurofly/proprioception_peer_morphology_source_audit.py"
      - "tests/test_proprioception_peer_morphology_source_audit.py"
      - ".github/workflows/snpp41-peer-morphology-source-inventory.yml"
      - "docs/experiments/V011_SNPP41_PEER_MORPHOLOGY_SOURCE_INVENTORY.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDIT_OUTPUT: runs/somatosensation/snpp41-peer-morphology-source-inventory.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install NeuroFly test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run unit gate
        run: pytest -q tests/test_proprioception_peer_morphology_source_audit.py
      - name: Discover or verify 21 exact VFB peer sources
        run: |
          mkdir -p "$(dirname "$AUDIT_OUTPUT")"
          python -m neurofly.proprioception_peer_morphology_source_audit \
            --output "$AUDIT_OUTPUT"
      - name: Publish peer source inventory receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-snpp41-peer-morphology-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AUDIT_OUTPUT }}
          if-no-files-found: warn
          retention-days: 3
