name: NeuroFly Exploratory Learning Remediation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: neurofly-exploratory-learning-remediation
  cancel-in-progress: false

jobs:
  exploratory-learning-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      STONKFLY_DATA: /home/runner/.cache/neurofly/stonkfly
      SOURCE_STATE: runs/free-malecns
      STUDY_DIR: runs/exploratory-learning-remediation
      BASE_CHECKPOINT: runs/exploratory-learning-remediation/base-brain.npz
      RECEIPT: runs/exploratory-learning-remediation/learning-remediation-receipt.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore prepared MaleCNS cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}

      - name: Restore latest production checkpoint read-only source
        uses: actions/cache/restore@v4
        with:
          path: runs/free-malecns
          key: neurofly-v06-state-learning-remediation-${{ github.run_id }}
          restore-keys: |
            neurofly-v06-state-

      - name: Install pinned Stonkfly integration
        run: python -m pip install -e '.[test,stonkfly]'

      - name: Prepare and verify MaleCNS
        run: |
          mkdir -p "$STONKFLY_DATA" "$STUDY_DIR"
          python -m stonkfly prepare
          python -m neurofly brain-status
          python -m neurofly host-preflight | tee "$STUDY_DIR/preflight.json"

      - name: Copy production brain into isolated exploratory baseline
        run: |
          test -f "$SOURCE_STATE/brain.npz"
          cp "$SOURCE_STATE/brain.npz" "$BASE_CHECKPOINT"
          test "$(realpath "$SOURCE_STATE/brain.npz")" != "$(realpath "$BASE_CHECKPOINT")"
          sha256sum "$SOURCE_STATE/brain.npz" "$BASE_CHECKPOINT"

      - name: Execute seed-effectiveness remediation study
        run: |
          python -m neurofly.learning_remediation_study             --base-checkpoint "$BASE_CHECKPOINT"             --output-dir "$STUDY_DIR/replicates"             --receipt "$RECEIPT"

      - name: Validate exploratory receipt and locked claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path(
                  "runs/exploratory-learning-remediation/"
                  "learning-remediation-receipt.json"
              ).read_text()
          )
          assert receipt["schema"] == "neurofly-learning-remediation-study-receipt-v0.1"
          assert receipt["status"] == "EXPLORATORY_REMEDIATION_COMPLETE"
          assert receipt["execution_valid"] is True
          assert all(receipt["config_gates"].values())
          assert all(receipt["evidence_gates"].values())
          assert receipt["learning_validated"] is False
          assert receipt["within_task_heldout_generalization_supported"] is False
          assert receipt["causal_learning_claim_authorized"] is False
          assert receipt["broad_generalization_validated"] is False
          assert receipt["behavioral_promotion_authorized"] is False
          assert receipt["replacement_confirmatory_authorized"] is False
          print(
              "EXPLORATORY_REMEDIATION_EXECUTION_VALID",
              receipt["receipt_sha256"],
              receipt["aggregate_descriptive_effects"],
          )
          PY

      - name: Publish exploratory remediation evidence only
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-learning-remediation-${{ github.run_id }}
          path: |
            runs/exploratory-learning-remediation/preflight.json
            runs/exploratory-learning-remediation/learning-remediation-receipt.json
          if-no-files-found: error
          retention-days: 7
