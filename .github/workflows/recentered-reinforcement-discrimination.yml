name: NeuroFly Recentered Reinforcement Discrimination

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: neurofly-recentered-reinforcement-discrimination
  cancel-in-progress: false

jobs:
  recentered-reinforcement-discrimination:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      STONKFLY_DATA: /home/runner/.cache/neurofly/stonkfly
      SOURCE_STATE: runs/free-malecns
      STUDY_DIR: runs/recentered-reinforcement-discrimination
      BASE_CHECKPOINT: runs/recentered-reinforcement-discrimination/base-brain.npz
      RECEIPT: runs/recentered-reinforcement-discrimination/recentered-reinforcement-discrimination-receipt.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore prepared MaleCNS cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}

      - name: Restore latest production checkpoint read-only source
        uses: actions/cache/restore@v4
        with:
          path: runs/free-malecns
          key: neurofly-v06-state-recentered-reinforcement-${{ github.run_id }}
          restore-keys: |
            neurofly-v06-state-

      - name: Install pinned Stonkfly integration
        run: python -m pip install -e '.[test,stonkfly]'

      - name: Prepare and verify MaleCNS
        run: |
          mkdir -p "$STONKFLY_DATA" "$STUDY_DIR"
          python -m stonkfly prepare
          python -m neurofly brain-status
          python -m neurofly host-preflight | tee "$STUDY_DIR/preflight.json"

      - name: Copy production brain into isolated intervention baseline
        run: |
          test -f "$SOURCE_STATE/brain.npz"
          cp "$SOURCE_STATE/brain.npz" "$BASE_CHECKPOINT"
          test "$(realpath "$SOURCE_STATE/brain.npz")" != "$(realpath "$BASE_CHECKPOINT")"
          sha256sum "$SOURCE_STATE/brain.npz" "$BASE_CHECKPOINT"

      - name: Execute recentered reinforcement discrimination
        run: |
          python -m neurofly.recentered_reinforcement_discrimination \
            --base-checkpoint "$BASE_CHECKPOINT" \
            --output-dir "$STUDY_DIR/replicates" \
            --receipt "$RECEIPT"

      - name: Validate intervention receipt without opening claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path(
                  "runs/recentered-reinforcement-discrimination/"
                  "recentered-reinforcement-discrimination-receipt.json"
              ).read_text()
          )
          assert receipt["schema"] == "neurofly-recentered-reinforcement-discrimination-receipt-v0.1"
          assert receipt["status"] == "EXPLORATORY_INTERVENTION_COMPLETE"
          assert receipt["execution_valid"] is True
          assert all(receipt["config_gates"].values())
          assert all(receipt["evidence_gates"].values())
          assert receipt["learning_validated"] is False
          assert receipt["true_reinforcement_discriminated"] is False
          assert receipt["causal_learning_claim_authorized"] is False
          assert receipt["replacement_confirmatory_authorized"] is False
          assert receipt["behavioral_promotion_authorized"] is False
          assert receipt["production_checkpoint_mutated"] is False
          print(
              "RECENTERED_REINFORCEMENT_DISCRIMINATION_VALID",
              receipt["receipt_sha256"],
              receipt["aggregate"],
          )
          PY

      - name: Publish intervention evidence only
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-recentered-reinforcement-discrimination-${{ github.run_id }}
          path: |
            runs/recentered-reinforcement-discrimination/preflight.json
            runs/recentered-reinforcement-discrimination/recentered-reinforcement-discrimination-receipt.json
          if-no-files-found: error
          retention-days: 7
