name: NeuroFly SNpp41 Body 905407 NBLAST Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/proprioception-snpp41-body905407-nblast-audit.yml"
      - "src/neurofly/proprioception_nblast_audit.py"
      - "tests/test_proprioception_nblast_audit.py"
      - "docs/experiments/V011_SNPP41_BODY905407_NBLAST_AUDIT.md"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neurofly-snpp41-body905407-nblast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  malecns-snpp41-body905407-nblast-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STONKFLY_DATA: /home/runner/.cache/neurofly/stonkfly
      AUDIT_OUTPUT: runs/somatosensation/snpp41-body905407-nblast-audit.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore prepared MaleCNS cache read-only
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            malecns-v1-

      - name: Install pinned MaleCNS and morphology toolchain
        run: |
          python -m pip install -e '.[test,stonkfly]'
          python -m pip install 'navis==1.12.0' 'flybrains==0.6.2'
          python - <<'PY'
          import importlib.metadata as metadata
          assert metadata.version('navis') == '1.12.0'
          assert metadata.version('flybrains') == '0.6.2'
          print({'navis': metadata.version('navis'), 'flybrains': metadata.version('flybrains')})
          PY

      - name: Prepare or verify pinned MaleCNS
        run: |
          mkdir -p "$STONKFLY_DATA" "$(dirname "$AUDIT_OUTPUT")"
          python -m stonkfly prepare
          python -m neurofly brain-status

      - name: Discover or verify registered-space NBLAST receipt
        run: |
          # Discovery-first: until an exact registered-space/NBLAST receipt SHA
          # is frozen, this step intentionally exits non-zero after publishing
          # deterministic evidence. No score threshold is chosen here.
          python -m neurofly.proprioception_nblast_audit \
            --output "$AUDIT_OUTPUT"

      - name: Publish body 905407 NBLAST receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-snpp41-body905407-nblast-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/somatosensation/snpp41-body905407-nblast-audit.json
          if-no-files-found: warn
          retention-days: 3
