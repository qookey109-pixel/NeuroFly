name: Research Walking Decoder V3 Threshold Scan

on:
  workflow_dispatch:
  push:
    branches:
      - research/walking-dn-population-audit
    paths:
      - "scripts/research_scan_walking_decoder_v3_threshold.py"
      - ".github/workflows/research-walking-decoder-v3-threshold.yml"

permissions:
  contents: read

jobs:
  threshold-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      STONKFLY_DATA: /home/runner/.cache/neurofly/stonkfly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}
      - run: python -m pip install -e '.[stonkfly]'
      - run: |
          mkdir -p "$STONKFLY_DATA"
          python -m stonkfly prepare
          python -m stonkfly verify
      - name: Scan V3 steering thresholds
        run: python scripts/research_scan_walking_decoder_v3_threshold.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walking-decoder-v3-threshold-scan
          path: artifacts/walking_decoder_v3_threshold_scan.json
          if-no-files-found: error
