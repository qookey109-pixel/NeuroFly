name: NeuroFly Proprioception FeCO Crosswalk Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/proprioception-feco-crosswalk-audit.yml"
      - "data/proprioception_feco_functional_crosswalk_v01.json"
      - "data/proprioception_feco_functional_crosswalk_v02.json"
      - "data/proprioception_feco_functional_crosswalk_v03.json"
      - "src/neurofly/proprioception_crosswalk_audit.py"
      - "tests/test_proprioception_crosswalk_audit.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neurofly-proprioception-feco-crosswalk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  malecns-proprioception-feco-crosswalk-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STONKFLY_DATA: /home/runner/.cache/neurofly/stonkfly
      CROSSWALK: data/proprioception_feco_functional_crosswalk_v03.json
      AUDIT_OUTPUT: runs/somatosensation/proprioception-feco-crosswalk-audit.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore prepared MaleCNS cache read-only
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/neurofly/stonkfly
          key: malecns-v1-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            malecns-v1-

      - name: Install pinned Stonkfly integration
        run: python -m pip install -e '.[test,stonkfly]'

      - name: Prepare or verify pinned MaleCNS
        run: |
          mkdir -p "$STONKFLY_DATA" "$(dirname "$AUDIT_OUTPUT")"
          python -m stonkfly prepare
          python -m neurofly brain-status

      - name: Audit evidence-backed FeCO exact types
        run: |
          python -m neurofly.proprioception_crosswalk_audit \
            --crosswalk "$CROSSWALK" \
            --output "$AUDIT_OUTPUT"
          python - <<'PY'
          import json
          import os

          report = json.load(open(os.environ["AUDIT_OUTPUT"]))
          assert report["schema"] == "neurofly-proprioception-feco-functional-crosswalk-audit-v2"
          assert report["crosswalk_schema"] == "neurofly-proprioception-feco-functional-crosswalk-v0.3"
          assert report["crosswalk_type_count"] == 5
          assert report["crosswalk_types"] == [
              "SNpp39", "SNpp41", "SNpp58", "SNpp59", "SNpp60"
          ]
          assert report["passed"] is True
          assert int(report["proprioceptive_neurons_total"]) == 1454
          assert int(report["chordotonal_organ_neurons_total"]) == 425
          assert int(report["selected_feco_candidates"]) == 124
          assert int(report["unresolved_proprioceptive_neurons"]) == 1330
          assert report["selected_type_counts"] == {
              "SNpp39": 39,
              "SNpp41": 22,
              "SNpp58": 16,
              "SNpp59": 6,
              "SNpp60": 41,
          }
          assert report["selected_function_counts"] == {
              "feco_club_bidirectional_motion_vibration_candidate": 63,
              "feco_hook_motion_direction_candidate": 61,
          }
          assert report["hook_types"] == ["SNpp39", "SNpp41"]
          assert report["hook_direction_identity"] == {
              "SNpp39": "unresolved",
              "SNpp41": "unresolved",
          }
          assert report["directional_hook_identity_resolved"] is False
          assert report["current_calibration_authorized"] is False
          assert report["gates"]["complete_hook_pair_present"] is True
          assert report["gates"]["hook_direction_identity_remains_unresolved"] is True
          assert report["gates"]["current_calibration_remains_blocked"] is True
          assert not report["missing_crosswalk_types"]
          assert not report["non_proprioceptive_mapped_rows"]
          assert not report["disallowed_subclass_rows"]
          assert report["stimulation_enabled"] is False
          assert report["runtime_transduction_enabled"] is False
          print(
              "PROPRIOCEPTION_FECO_HOOK_PAIR_EVIDENCE_PASS",
              "selected=", report["selected_feco_candidates"],
              "types=", report["selected_type_counts"],
              "hook_direction=", report["hook_direction_identity"],
              "current_calibration_authorized=", report["current_calibration_authorized"],
          )
          PY

      - name: Publish compact FeCO crosswalk evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurofly-proprioception-feco-crosswalk-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/somatosensation/proprioception-feco-crosswalk-audit.json
          if-no-files-found: warn
          retention-days: 3
