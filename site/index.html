<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>NeuroFly</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <section class="lab-layout" aria-label="NeuroFly MaleCNS 自我訓練迷宮">
      <div class="game-shell">
        <canvas id="mazeCanvas" width="950" height="700"></canvas>
      </div>

      <aside class="clear-panel" aria-label="活動與破關紀錄">
        <div class="brain-badge" id="brainBadge">MALECNS · 驗證中</div>
        <h1>活動與破關紀錄</h1>

        <div class="goal-hud" aria-live="polite">
          <div><span>總活動時間</span><strong id="totalTime">—</strong></div>
          <div><span>首次破關</span><strong id="firstClear">—</strong></div>
          <div><span>最近破關</span><strong id="latestClear">—</strong></div>
          <div><span>最佳破關</span><strong id="bestClear">—</strong></div>
          <div><span>破關次數</span><strong id="clearCount">0</strong></div>
        </div>

        <div class="history-block">
          <span class="history-label">最近破關紀錄</span>
          <div class="clear-history" id="clearHistory">尚未破關</div>
        </div>

        <div class="history-block">
          <span class="history-label">每一次破關時間</span>
          <div class="clear-history" id="allClearHistory" style="max-height: 220px; overflow: auto;">尚未破關</div>
        </div>

        <div class="run-status" id="runStatus">等待已驗證的 MaleCNS 即時狀態…</div>
      </aside>
    </section>
  </main>
  <script src="app.js"></script>
  <script src="all-clear-history.js"></script>
</body>
</html>
