<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>NeuroFly</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <section class="lab-layout" aria-label="NeuroFly MaleCNS self-training maze">
      <div class="game-shell">
        <canvas id="mazeCanvas" width="950" height="700"></canvas>
      </div>

      <aside class="clear-panel" aria-label="破關紀錄">
        <div class="brain-badge" id="brainBadge">MALECNS · VERIFYING</div>
        <h1>破關紀錄</h1>

        <div class="goal-hud" aria-live="polite">
          <div><span>FIRST CLEAR</span><strong id="firstClear">—</strong></div>
          <div><span>LATEST</span><strong id="latestClear">—</strong></div>
          <div><span>BEST</span><strong id="bestClear">—</strong></div>
          <div><span>CLEARS</span><strong id="clearCount">0</strong></div>
        </div>

        <div class="history-block">
          <span class="history-label">RECENT CLEARS</span>
          <div class="clear-history" id="clearHistory">尚未破關</div>
        </div>

        <div class="run-status" id="runStatus">Waiting for verified MaleCNS trajectory…</div>
      </aside>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
