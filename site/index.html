<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>NeuroFly</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <section class="game-shell" aria-label="NeuroFly MaleCNS self-training maze">
      <canvas id="mazeCanvas" width="950" height="700"></canvas>

      <div class="brain-badge" id="brainBadge">MALECNS · VERIFYING</div>

      <div class="goal-hud" aria-live="polite">
        <div><span>FIRST CLEAR</span><strong id="firstClear">—</strong></div>
        <div><span>LATEST</span><strong id="latestClear">—</strong></div>
        <div><span>BEST</span><strong id="bestClear">—</strong></div>
        <div><span>CLEARS</span><strong id="clearCount">0</strong></div>
      </div>

      <div class="run-status" id="runStatus">Waiting for verified MaleCNS trajectory…</div>
      <div class="clear-history" id="clearHistory"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
